<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferwap Admin Portal</title>
    <!-- Memuat Supabase Client dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 15px 0; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #e50914; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #b20710; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Ferwap Admin Portal</h2>

    <!-- BAGIAN 1: FORM LOGIN -->
    <div id="login-section" class="card">
        <h3>Login Admin</h3>
        <input type="email" id="email" placeholder="Email Admin">
        <input type="password" id="password" placeholder="Password">
        <button onclick="loginAdmin()">Login</button>
        <p id="login-status" style="color: #ff5555;"></p>
    </div>

    <!-- BAGIAN 2: PANEL UTAMA EDIT KONTEN (Muncul Setelah Login) -->
    <div id="admin-panel" class="card hidden">
        <h3>Kelola Teks Web Utama</h3>
        <p>Ubah konten teks situs ferwap.com secara instan.</p>
        
        <label>Hero Title (Judul Utama):</label>
        <input type="text" id="input-title" placeholder="Contoh: Ferwap Music Entertainment">

        <label>Hero Description (Deskripsi):</label>
        <textarea id="input-desc" rows="3" placeholder="Deskripsi singkat label..."></textarea>

        <button onclick="saveContent()">Simpan Perubahan</button>
        <p id="save-status" style="color: #55ff55; margin-top: 10px;"></p>
        
        <br><hr style="border-color: #444; margin: 20px 0;">
        <button onclick="logoutAdmin()" style="background: #444;">Logout</button>
    </div>

    <script>
        // Konfigurasi Supabase Kamu (Ganti dengan URL & Anon Key dari Project Supabase kamu) 
        const SUPABASE_URL = 'https://donsspcslvpzuphptmft.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvbnNzcGNzbHZwenVwaHB0bWZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNDMyMTMsImV4cCI6MjEwOTgxOTIxM30.P_V9vLXaUdoxY5EGMMQYrL4Ecjze_By6PI-hDj7jyH8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fungsi Login
        async function loginAdmin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('login-status');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                statusEl.textContent = 'Gagal Login: ' + error.message;
            } else {
                statusEl.textContent = '';
                checkAuth();
            }
        }

        // Cek Status Sesi Login
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadCurrentData(); // Ambil data teks yang ada saat ini
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        }

        // Ambil Data dari Supabase untuk Ditampilkan di Form
        async function loadCurrentData() {
            const { data, error } = await supabaseClient
                .from('site_content')
                .select('section_key, content_value');

            if (!error && data) {
                data.forEach(item => {
                    if (item.section_key === 'hero_title') {
                        document.getElementById('input-title').value = item.content_value;
                    }
                    if (item.section_key === 'hero_desc') {
                        document.getElementById('input-desc').value = item.content_value;
                    }
                });
            }
        }

        // Simpan Perubahan ke Supabase
        async function saveContent() {
            const newTitle = document.getElementById('input-title').value;
            const newDesc = document.getElementById('input-desc').value;
            const saveStatus = document.getElementById('save-status');

            // Update baris 'hero_title'
            await supabaseClient
                .from('site_content')
                .update({ content_value: newTitle })
                .eq('section_key', 'hero_title');

            // Update baris 'hero_desc'
            await supabaseClient
                .from('site_content')
                .update({ content_value: newDesc })
                .eq('section_key', 'hero_desc');

            saveStatus.textContent = 'Berhasil disimpan! Web utama sudah terperbarui.';
            setTimeout(() => { saveStatus.textContent = ''; }, 4000);
        }

        // Fungsi Logout
        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            checkAuth();
        }

        // Jalankan pengecekan sesi saat halaman pertama kali dibuka
        checkAuth();
    </script>
</body>
</html>
